name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Publish debug APK to Release (latest-debug)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-debug >/dev/null 2>&1 || gh release create latest-debug --title "Latest debug build" --notes "Auto-built debug APK from the latest main commit. Download app-debug.apk from the Assets below."
          gh release upload latest-debug app/build/outputs/apk/debug/app-debug.apk --clobber
      # Runs R8/ProGuard + resource shrinking; -PciBuild skips the proxy-secrets check (unsigned output).
      - name: Release build (shrink check)
        run: gradle :app:assembleRelease -PciBuild=true --no-daemon

  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Proxy tests
        working-directory: server
        run: npm test
      - name: Cloud computer tests
        working-directory: cloud-computer
        run: npm test
      - name: Cloud agent tests
        working-directory: cloud-agent
        run: npm test

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Compose UI tests (emulator, API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: gradle :app:connectedDebugAndroidTest --no-daemon
